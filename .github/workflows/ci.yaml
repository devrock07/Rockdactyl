name: Backend

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: backend-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: PHP ${{ matrix.php }} / ${{ matrix.database.name }}
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        env:
            COMPOSER_NO_INTERACTION: '1'
            COMPOSER_PROCESS_TIMEOUT: '0'
        strategy:
            fail-fast: false
            matrix:
                php:
                    - '8.2'
                    - '8.3'
                database:
                    - name: mariadb:10
                      image: mariadb:10@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
                    - name: mariadb:11
                      image: mariadb:11@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
                    - name: mysql:8
                      image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
                    - name: mysql:9
                      image: mysql:9@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
        services:
            database:
                image: ${{ matrix.database.image }}
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                    MYSQL_DATABASE: testing
                options: >-
                    --health-cmd "if command -v mariadb-admin >/dev/null 2>&1; then mariadb-admin ping --host=127.0.0.1 --user=root --silent; else mysqladmin ping --host=127.0.0.1 --user=root --silent; fi"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
                    --health-start-period 20s
                ports:
                    - 3306/tcp
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: bcmath, cli, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
                  tools: composer:v2
                  coverage: none

            - name: Resolve Composer cache
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-${{ matrix.php }}-

            - name: Configure test environment
              run: cp .env.ci .env

            - name: Validate Composer metadata
              run: composer validate --strict --no-check-publish

            - name: Install dependencies
              run: composer install --no-progress --prefer-dist

            - name: Check PHP formatting
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Run unit tests
              run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Unit
              env:
                  DB_HOST: UNIT_NO_DB

            - name: Run integration tests
              run: vendor/bin/phpunit tests/Integration
              env:
                  DB_HOST: 127.0.0.1
                  DB_PORT: ${{ job.services.database.ports['3306'] }}
                  DB_USERNAME: root
