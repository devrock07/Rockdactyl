name: Upstream Autopilot

on:
    schedule:
        - cron: '17 2 * * *'
    workflow_dispatch:
        inputs:
            upstream_tag:
                description: Optional Pterodactyl tag (for example v1.15.1)
                required: false
                type: string

concurrency:
    group: rock-theme-upstream-autopilot
    cancel-in-progress: false

permissions:
    contents: read

env:
    CONTAINER_PACKAGE: rock-theme
    UPSTREAM_REPOSITORY: pterodactyl/panel

jobs:
    detect:
        name: Detect upstream release
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            packages: read # Required to verify published GHCR tags without rebuilding healthy releases.
        outputs:
            current: ${{ steps.versions.outputs.current }}
            current_upstream_commit: ${{ steps.versions.outputs.current_upstream_commit }}
            edge_commit: ${{ steps.versions.outputs.edge_commit }}
            edge_container_required: ${{ steps.versions.outputs.edge_container_required }}
            latest: ${{ steps.versions.outputs.latest }}
            latest_upstream_commit: ${{ steps.versions.outputs.latest_upstream_commit }}
            mode: ${{ steps.versions.outputs.mode }}
            next_theme: ${{ steps.versions.outputs.next_theme }}
            release_required: ${{ steps.versions.outputs.release_required }}
            source_commit: ${{ steps.versions.outputs.source_commit }}
            tag_required: ${{ steps.versions.outputs.tag_required }}
            theme_tag: ${{ steps.versions.outputs.theme_tag }}
            update_required: ${{ steps.versions.outputs.update_required }}
            version_container_required: ${{ steps.versions.outputs.version_container_required }}
            work_required: ${{ steps.versions.outputs.work_required }}
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Resolve versions
              id: versions
              env:
                  GH_TOKEN: ${{ github.token }}
                  REQUESTED_TAG: ${{ inputs.upstream_tag }}
              run: |
                  set -euo pipefail
                  current="$(tr -d '[:space:]' < .rock/upstream-version)"
                  latest="${REQUESTED_TAG:-}"
                  if [ -z "$latest" ]; then
                      latest="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"
                  fi
                  if ! [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Invalid upstream version: current=$current latest=$latest" >&2
                      exit 1
                  fi
                  if [ "$current" != "$latest" ] && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" != "$latest" ]; then
                      echo "Refusing to downgrade the upstream base from $current to $latest." >&2
                      exit 1
                  fi
                  deferred_latest=""
                  persisted_candidate_sha="$(git ls-remote origin refs/heads/automation/upstream-candidate | awk 'NR == 1 { print $1 }')"
                  if [ -n "$persisted_candidate_sha" ]; then
                      if ! [[ "$persisted_candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
                          echo "Invalid persisted candidate commit: $persisted_candidate_sha" >&2
                          exit 1
                      fi
                      if [ "$current" != "$latest" ]; then
                          deferred_latest="$latest"
                          latest="$current"
                      fi
                  fi

                  resolve_upstream_tag_commit() {
                      local direct_ref peeled_ref remote_commit remote_refs tag="$1"
                      direct_ref="refs/tags/${tag}"
                      peeled_ref="${direct_ref}^{}"
                      remote_refs="$(git ls-remote --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" \
                          "$direct_ref" "$peeled_ref")"
                      remote_commit="$(printf '%s\n' "$remote_refs" | awk -v direct="$direct_ref" -v peeled="$peeled_ref" '
                          $2 == direct { direct_sha = $1 }
                          $2 == peeled { peeled_sha = $1 }
                          END { print peeled_sha != "" ? peeled_sha : direct_sha }
                      ')"
                      if ! [[ "$remote_commit" =~ ^[0-9a-f]{40}$ ]]; then
                          echo "Unable to resolve immutable upstream tag $tag." >&2
                          return 1
                      fi
                      printf '%s\n' "$remote_commit"
                  }

                  current_upstream_commit="$(resolve_upstream_tag_commit "$current")"
                  latest_upstream_commit="$(resolve_upstream_tag_commit "$latest")"

                  package_version="$(node -p "require('./package.json').version")"
                  if ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "The package version is not a stable semantic version: $package_version" >&2
                      exit 1
                  fi
                  package_theme="v${package_version}"
                  releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp)"
                  current_theme="$(printf '%s' "$releases" | jq -r '.[][] | .tag_name // empty' |
                      awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"
                  current_theme="${current_theme:-$package_theme}"
                  if ! [[ "$current_theme" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      echo "Unable to resolve the current Rockdactyl tag." >&2
                      exit 1
                  fi
                  if [ "$(printf '%s\n%s\n' "$current_theme" "$package_theme" | sort -V | tail -n 1)" != "$package_theme" ]; then
                      echo "Package version $package_theme is older than published Rockdactyl release $current_theme." >&2
                      exit 1
                  fi

                  mode=healthy
                  work_required=false
                  update_required=false
                  tag_required=false
                  release_required=false
                  version_container_required=false
                  edge_container_required=false
                  manual_release_pending=false
                  source_commit=""
                  edge_commit=""

                  if [ "$current" != "$latest" ]; then
                      base_theme="$(printf '%s\n%s\n' "$current_theme" "$package_theme" | sort -V | tail -n 1)"
                      if ! [[ "$base_theme" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                          echo "Unable to calculate the next Rockdactyl version." >&2
                          exit 1
                      fi
                      theme_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
                      mode=update
                      work_required=true
                      update_required=true
                      tag_required=true
                      release_required=true
                      version_container_required=true
                      edge_container_required=true
                  else
                      theme_tag="$package_theme"
                      main_commit="$(git rev-parse HEAD)"
                      head_commit="$main_commit"
                      edge_commit="$main_commit"
                      candidate_pending=false
                      candidate_ref="refs/remotes/rock-candidate/pending"
                      candidate_sha="$persisted_candidate_sha"
                      if [ -n "$candidate_sha" ]; then
                          git -c core.hooksPath=/dev/null fetch --force --no-tags origin \
                              "+refs/heads/automation/upstream-candidate:${candidate_ref}"
                          test "$(git rev-parse "${candidate_ref}^{commit}")" = "$candidate_sha"
                          git merge-base --is-ancestor "$candidate_sha" "$main_commit"
                          candidate_upstream="$(git show "${candidate_sha}:.rock/upstream-version" | tr -d '[:space:]')"
                          candidate_version="$(git show "${candidate_sha}:package.json" | jq -er .version)"
                          if [ "$candidate_upstream" != "$latest" ] ||
                              ! [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                              echo "Persisted candidate metadata is not valid for $latest." >&2
                              exit 1
                          fi
                          theme_tag="v${candidate_version}"
                          if [ "$theme_tag" != "$package_theme" ]; then
                              echo "Persisted candidate $theme_tag no longer matches main package version $package_theme." >&2
                              exit 1
                          fi
                          head_commit="$candidate_sha"
                          candidate_pending=true
                      fi

                      if git show-ref --verify --quiet "refs/tags/${theme_tag}"; then
                          tag_commit="$(git rev-parse "${theme_tag}^{commit}")"
                          tag_upstream="$(git show "${tag_commit}:.rock/upstream-version" | tr -d '[:space:]')"
                          tag_version="$(git show "${tag_commit}:package.json" | jq -er .version)"
                          if [ "$tag_upstream" != "$latest" ] || [ "v${tag_version}" != "$theme_tag" ]; then
                              echo "Existing tag $theme_tag does not contain matching release metadata." >&2
                              exit 1
                          fi
                          if [ "$candidate_pending" = true ]; then
                              if [ "$tag_commit" != "$head_commit" ]; then
                                  echo "Refusing to move immutable tag $theme_tag from $tag_commit to $head_commit." >&2
                                  exit 1
                              fi
                          else
                              if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
                                  echo "Existing tag $theme_tag is not an ancestor of current main." >&2
                                  exit 1
                              fi
                              head_commit="$tag_commit"
                          fi
                      else
                          tag_required=true
                      fi
                      source_commit="$head_commit"

                      validate_release_assets() {
                          local checksum release_dir provenance
                          release_dir="$(mktemp -d)"
                          if ! gh release download "$theme_tag" --dir "$release_dir" \
                              --pattern panel.tar.gz --pattern panel.tar.gz.sha256 >/dev/null 2>&1; then
                              rm -rf "$release_dir"
                              return 1
                          fi
                          if [ "$(find "$release_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -ne 2 ] ||
                              [ -L "$release_dir/panel.tar.gz" ] || [ -L "$release_dir/panel.tar.gz.sha256" ]; then
                              rm -rf "$release_dir"
                              return 1
                          fi
                          checksum="$(cat "$release_dir/panel.tar.gz.sha256")"
                          if ! [[ "$checksum" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]panel\.tar\.gz$ ]]; then
                              rm -rf "$release_dir"
                              return 1
                          fi
                          if ! (cd "$release_dir" && sha256sum --check panel.tar.gz.sha256 >/dev/null); then
                              rm -rf "$release_dir"
                              return 1
                          fi
                          provenance="$(tar -xOf "$release_dir/panel.tar.gz" ./.rock/release.json 2>/dev/null || true)"
                          if ! printf '%s' "$provenance" | jq -e \
                              --arg theme_version "${theme_tag#v}" \
                              --arg pterodactyl_version "$latest" \
                              --arg source_commit "$head_commit" '
                                  .schema == 1 and
                                  .theme_version == $theme_version and
                                  .pterodactyl_version == $pterodactyl_version and
                                  .source_commit == $source_commit
                              ' >/dev/null; then
                              rm -rf "$release_dir"
                              return 1
                          fi
                          rm -rf "$release_dir"
                      }

                      release="$(printf '%s' "$releases" | jq -c --arg tag "$theme_tag" '[.[][] | select(.tag_name == $tag)][0] // null')"
                      if [ "$release" = null ]; then
                          release_required=true
                      else
                          autopilot_marker="<!-- rock-theme-autopilot:source=${head_commit} -->"
                          release_author="$(printf '%s' "$release" | jq -r '.author.login // empty')"
                          release_body="$(printf '%s' "$release" | jq -r '.body // ""')"
                          release_owned=false
                          release_needs_repair=false
                          if [ "$release_author" = 'github-actions[bot]' ] &&
                              [[ "$release_body" == *"$autopilot_marker"* ]]; then
                              release_owned=true
                          fi
                          if [ "$(printf '%s' "$release" | jq -r '.draft')" = true ] ||
                              ! printf '%s' "$release" | jq -e '
                                  ([.assets[]?.name] | index("panel.tar.gz")) != null and
                                  ([.assets[]?.name] | index("panel.tar.gz.sha256")) != null
                              ' >/dev/null; then
                              release_needs_repair=true
                          elif ! validate_release_assets; then
                              echo "Release $theme_tag assets failed checksum or provenance validation."
                              release_needs_repair=true
                          fi
                          if [ "$release_needs_repair" = true ]; then
                              if [ "$release_owned" = true ]; then
                                  release_required=true
                              else
                                  echo "Release $theme_tag requires human review; Autopilot ownership was not proven."
                                  manual_release_pending=true
                              fi
                          fi
                      fi

                      if [ "$manual_release_pending" = true ]; then
                          echo "::notice title=Human release review required::Release $theme_tag is untouched because Autopilot ownership was not proven."
                          mode=human-review
                          work_required=false
                          tag_required=false
                          release_required=false
                          version_container_required=false
                          edge_container_required=false
                      else
                          owner_type="$(gh api "users/${GITHUB_REPOSITORY_OWNER}" --jq .type)"
                          if [ "$owner_type" = Organization ]; then
                              package_scope="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container"
                          else
                              package_scope="users/${GITHUB_REPOSITORY_OWNER}/packages/container"
                          fi
                          package_error="$(mktemp)"
                          if ! package_pages="$(gh api --paginate "${package_scope}/${CONTAINER_PACKAGE}/versions?per_page=100" --slurp 2>"$package_error")"; then
                              if grep -q 'HTTP 404' "$package_error"; then
                                  package_pages='[]'
                              else
                                  cat "$package_error" >&2
                                  exit 1
                              fi
                          fi
                          rm -f "$package_error"

                          version_tag="${theme_tag#v}"
                          minor_tag="${version_tag%.*}"
                          release_revision_tag="source-release-${head_commit}"
                          edge_revision_tag="source-edge-${edge_commit}"
                          conflicting_release_source="$(printf '%s' "$package_pages" | jq -r \
                              --arg version "$version_tag" --arg source "$release_revision_tag" '
                                  [.[][] | (.metadata.container.tags // []) |
                                      select(index($version) != null) | .[] |
                                      select(startswith("source-release-") and . != $source)] |
                                  unique | first // empty
                              ')"
                          if [ -n "$conflicting_release_source" ]; then
                              echo "Container tag $version_tag belongs to $conflicting_release_source, not $release_revision_tag." >&2
                              exit 1
                          fi
                          if ! printf '%s' "$package_pages" | jq -e \
                              --arg version "$version_tag" --arg minor "$minor_tag" --arg source "$release_revision_tag" '
                                  [.[][] | (.metadata.container.tags // [])] |
                                  any(.[]; index($version) != null and index($minor) != null and
                                      index("latest") != null and index($source) != null)
                              ' >/dev/null; then
                              version_container_required=true
                          fi
                          if ! printf '%s' "$package_pages" | jq -e --arg source "$edge_revision_tag" '
                              [.[][] | (.metadata.container.tags // [])] |
                              any(.[]; index("edge") != null and index($source) != null)
                          ' >/dev/null; then
                              edge_container_required=true
                          fi

                          if [ "$tag_required" = true ] || [ "$release_required" = true ] ||
                              [ "$version_container_required" = true ] || [ "$edge_container_required" = true ] ||
                              [ "$candidate_pending" = true ]; then
                              mode=reconcile
                              work_required=true
                          fi
                      fi
                  fi

                  echo "current=$current" >> "$GITHUB_OUTPUT"
                  echo "current_upstream_commit=$current_upstream_commit" >> "$GITHUB_OUTPUT"
                  echo "edge_commit=$edge_commit" >> "$GITHUB_OUTPUT"
                  echo "latest=$latest" >> "$GITHUB_OUTPUT"
                  echo "latest_upstream_commit=$latest_upstream_commit" >> "$GITHUB_OUTPUT"
                  echo "mode=$mode" >> "$GITHUB_OUTPUT"
                  echo "next_theme=$theme_tag" >> "$GITHUB_OUTPUT"
                  echo "theme_tag=$theme_tag" >> "$GITHUB_OUTPUT"
                  echo "work_required=$work_required" >> "$GITHUB_OUTPUT"
                  echo "update_required=$update_required" >> "$GITHUB_OUTPUT"
                  echo "tag_required=$tag_required" >> "$GITHUB_OUTPUT"
                  echo "release_required=$release_required" >> "$GITHUB_OUTPUT"
                  echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
                  echo "version_container_required=$version_container_required" >> "$GITHUB_OUTPUT"
                  echo "edge_container_required=$edge_container_required" >> "$GITHUB_OUTPUT"
                  {
                      echo "### Upstream detection"
                      echo "- Current base: \`$current\`"
                      echo "- Latest release: \`$latest\`"
                      if [ -n "$deferred_latest" ]; then
                          echo "- Deferred until pending publication completes: \`$deferred_latest\`"
                      fi
                      echo "- Theme release: \`$theme_tag\`"
                      echo "- Release source: \`${source_commit:-pending merge}\`"
                      echo "- Mode: \`$mode\`"
                      if [ "$manual_release_pending" = true ]; then
                          echo "- Publication: waiting for review of a release Autopilot does not own"
                      fi
                      echo "- Git tag repair: \`$tag_required\`"
                      echo "- GitHub release repair: \`$release_required\`"
                      echo "- Version/Latest container repair: \`$version_container_required\`"
                      echo "- Edge container repair: \`$edge_container_required\`"
                  } >> "$GITHUB_STEP_SUMMARY"

    prepare:
        name: Prepare verified candidate
        needs: detect
        if: needs.detect.outputs.work_required == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        outputs:
            base: ${{ steps.prepare.outputs.base }}
            commit: ${{ steps.prepare.outputs.commit }}
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Merge official changes over the theme
              id: prepare
              env:
                  CURRENT_TAG: ${{ needs.detect.outputs.current }}
                  EXPECTED_CURRENT_UPSTREAM: ${{ needs.detect.outputs.current_upstream_commit }}
                  EXPECTED_LATEST_UPSTREAM: ${{ needs.detect.outputs.latest_upstream_commit }}
                  EXPECTED_SOURCE: ${{ needs.detect.outputs.source_commit }}
                  LATEST_TAG: ${{ needs.detect.outputs.latest }}
                  MODE: ${{ needs.detect.outputs.mode }}
                  THEME_TAG: ${{ needs.detect.outputs.theme_tag }}
              run: |
                  set -euo pipefail
                  branch="automation/upstream-candidate"
                  trusted_metadata="$GITHUB_WORKSPACE/.git/rock-update-upstream-metadata.js"
                  cp scripts/update-upstream-metadata.js "$trusted_metadata"
                  main_commit="$(git rev-parse HEAD)"
                  echo "base=$main_commit" >> "$GITHUB_OUTPUT"

                  if [ "$MODE" = reconcile ]; then
                      echo "Re-validating the preserved release candidate before repairing publication."
                      if ! [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
                          echo "Invalid expected release source: $EXPECTED_SOURCE" >&2
                          exit 1
                      fi
                      if [ "$EXPECTED_SOURCE" != "$main_commit" ]; then
                          candidate_ref="refs/remotes/rock-candidate/pending"
                          persisted_candidate="$(git ls-remote origin refs/heads/automation/upstream-candidate |
                              awk 'NR == 1 { print $1 }')"
                          if [ -n "$persisted_candidate" ]; then
                              if [ "$persisted_candidate" != "$EXPECTED_SOURCE" ]; then
                                  echo "Persisted candidate changed from $EXPECTED_SOURCE to $persisted_candidate." >&2
                                  exit 1
                              fi
                              git -c core.hooksPath=/dev/null fetch --force --no-tags origin \
                                  "+refs/heads/automation/upstream-candidate:${candidate_ref}"
                              test "$(git rev-parse "${candidate_ref}^{commit}")" = "$EXPECTED_SOURCE"
                              git checkout -B "$branch" "$candidate_ref"
                          else
                              if ! git show-ref --verify --quiet "refs/tags/${THEME_TAG}" ||
                                  [ "$(git rev-parse "${THEME_TAG}^{commit}")" != "$EXPECTED_SOURCE" ] ||
                                  ! git merge-base --is-ancestor "$EXPECTED_SOURCE" "$main_commit"; then
                                  echo "Release source $EXPECTED_SOURCE is neither the retry marker nor immutable tag $THEME_TAG." >&2
                                  exit 1
                              fi
                              git checkout -B "$branch" "$EXPECTED_SOURCE"
                          fi
                      else
                          git checkout -B "$branch"
                      fi
                      git bundle create "$RUNNER_TEMP/upstream-candidate.bundle" "refs/heads/$branch"
                      echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  base_ref="refs/rock-upstream/base"
                  latest_ref="refs/rock-upstream/latest"
                  protected_paths=(
                      README.md
                      CHANGELOG.md
                      LICENSE
                      SECURITY.md
                      PTERODACTYL_LICENSE.md
                      THIRD_PARTY_NOTICES.md
                      docs
                      .github/CODE_OF_CONDUCT.md
                      .github/CONTRIBUTING.md
                      .github/SUPPORT.md
                      .github/workflows
                      install.sh
                      release.sh
                      scripts/copy-compiled-assets.js
                      scripts/package-release.sh
                      scripts/update-upstream-metadata.js
                      scripts/verify-release-assets.sh
                      tests/InstallerSmokeTest.sh
                      tests/ReleaseToolingSmokeTest.sh
                      tests/UpstreamAutopilotWorkflow.test.ts
                  )
                  retired_paths=(
                      BRANDING.md
                      CODE_OF_CONDUCT.md
                      CONTRIBUTING.md
                      SUPPORT.md
                  )

                  git config user.name "rock-theme-autopilot[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if ! [[ "$EXPECTED_CURRENT_UPSTREAM" =~ ^[0-9a-f]{40}$ &&
                      "$EXPECTED_LATEST_UPSTREAM" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Invalid pinned upstream commit." >&2
                      exit 1
                  fi
                  git fetch --force --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" \
                      "+refs/tags/${CURRENT_TAG}:${base_ref}" \
                      "+refs/tags/${LATEST_TAG}:${latest_ref}"

                  upstream_base_commit="$(git rev-parse "${base_ref}^{commit}")"
                  latest_commit="$(git rev-parse "${latest_ref}^{commit}")"
                  if [ "$upstream_base_commit" != "$EXPECTED_CURRENT_UPSTREAM" ] ||
                      [ "$latest_commit" != "$EXPECTED_LATEST_UPSTREAM" ]; then
                      echo "An upstream release tag moved after detection; refusing the candidate." >&2
                      echo "Current: expected=$EXPECTED_CURRENT_UPSTREAM actual=$upstream_base_commit" >&2
                      echo "Latest: expected=$EXPECTED_LATEST_UPSTREAM actual=$latest_commit" >&2
                      exit 1
                  fi
                  theme_commit="$main_commit"
                  merge_status=0
                  merge_output="$(git merge-tree --write-tree --name-only --merge-base="$upstream_base_commit" "$theme_commit" "$latest_commit" 2>&1)" || merge_status=$?
                  merged_tree="$(printf '%s\n' "$merge_output" | head -n 1)"

                  if ! [[ "$merged_tree" =~ ^[0-9a-f]+$ ]]; then
                      echo "$merge_output" >&2
                      echo "The upstream merge did not produce a valid tree." >&2
                      exit 1
                  fi

                  if [ "$merge_status" -ne 0 ]; then
                      conflicts="$(printf '%s\n' "$merge_output" | sed -n '2,/^$/p' | sed '/^$/d')"
                      unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(README\.md|CHANGELOG\.md|LICENSE|SECURITY\.md|PTERODACTYL_LICENSE\.md|THIRD_PARTY_NOTICES\.md|BRANDING\.md|CODE_OF_CONDUCT\.md|CONTRIBUTING\.md|SUPPORT\.md|docs/.*|\.github/(CODE_OF_CONDUCT|CONTRIBUTING|SUPPORT)\.md|\.github/workflows/.*|install\.sh|release\.sh|scripts/(copy-compiled-assets|update-upstream-metadata)\.js|scripts/(package-release|verify-release-assets)\.sh|tests/(InstallerSmokeTest|ReleaseToolingSmokeTest)\.sh|tests/UpstreamAutopilotWorkflow\.test\.ts)$' || true)"
                      if [ -z "$conflicts" ] || [ -n "$unexpected" ]; then
                          echo "$merge_output" >&2
                          echo "The upstream release has genuine application conflicts with Rockdactyl." >&2
                          exit 1
                      fi

                      echo "Keeping fork-owned files while applying upstream application changes:"
                      printf '  - %s\n' $conflicts
                  fi

                  git checkout -B "$branch"
                  git read-tree --reset -u "$merged_tree"
                  git restore --source="$theme_commit" --staged --worktree -- "${protected_paths[@]}"
                  git rm -f --ignore-unmatch -- "${retired_paths[@]}"
                  if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
                      echo "Merge markers remain after resolving protected fork files." >&2
                      exit 1
                  fi
                  node "$trusted_metadata" "$LATEST_TAG" "$THEME_TAG"
                  git add -A
                  git commit -m "chore: update Pterodactyl to ${LATEST_TAG}"
                  git bundle create "$RUNNER_TEMP/upstream-candidate.bundle" "refs/heads/$branch"

                  echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Save candidate bundle
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: upstream-candidate-${{ steps.prepare.outputs.commit }}
                  path: ${{ runner.temp }}/upstream-candidate.bundle
                  if-no-files-found: error
                  retention-days: 2

    frontend:
        name: Validate frontend
        needs: [detect, prepare]
        if: needs.detect.outputs.work_required == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        env:
            CI: true
        permissions:
            contents: read
        steps:
            - name: Check out trusted workflow source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/heads/main
                  persist-credentials: false

            - name: Restore candidate bundle
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: upstream-candidate-${{ needs.prepare.outputs.commit }}
                  path: ${{ runner.temp }}

            - name: Check out verified candidate
              env:
                  EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
              run: |
                  set -euo pipefail
                  if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Invalid candidate commit: $EXPECTED_COMMIT" >&2
                      exit 1
                  fi
                  bundle="$RUNNER_TEMP/upstream-candidate.bundle"
                  git bundle verify "$bundle"
                  git fetch --force --no-tags "$bundle" \
                      '+refs/heads/automation/upstream-candidate:refs/remotes/rock-candidate/main'
                  actual_commit="$(git rev-parse 'refs/remotes/rock-candidate/main^{commit}')"
                  if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
                      echo "Candidate bundle resolved to $actual_commit, expected $EXPECTED_COMMIT." >&2
                      exit 1
                  fi
                  git checkout --detach refs/remotes/rock-candidate/main
                  test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

            - name: Validate installer scripts
              run: |
                  bash -n install.sh release.sh scripts/package-release.sh scripts/verify-release-assets.sh
                  bash tests/InstallerSmokeTest.sh
                  bash tests/ReleaseToolingSmokeTest.sh

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22

            - name: Install dependencies
              run: yarn install --frozen-lockfile --non-interactive

            - name: Validate release metadata
              run: yarn metadata:check

            - name: Typecheck
              run: yarn tsc

            - name: Typecheck responsive QA
              run: yarn test:responsive:typecheck

            - name: Lint
              run: yarn lint

            - name: Test
              run: yarn test --ci --runInBand

            - name: Verify reproducible production assets
              run: bash scripts/verify-release-assets.sh

            - name: Create verified release archive
              env:
                  LATEST_TAG: ${{ needs.detect.outputs.latest }}
                  THEME_TAG: ${{ needs.detect.outputs.theme_tag }}
              run: |
                  set -euo pipefail
                  release_dir="$RUNNER_TEMP/verified-release"
                  mkdir -p "$release_dir"
                  bash scripts/package-release.sh "$release_dir/panel.tar.gz"
                  (cd "$release_dir" && sha256sum panel.tar.gz > panel.tar.gz.sha256)
                  checksum="$(cat "$release_dir/panel.tar.gz.sha256")"
                  if ! [[ "$checksum" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]panel\.tar\.gz$ ]]; then
                      echo "Release checksum did not use the canonical panel.tar.gz record." >&2
                      exit 1
                  fi
                  (cd "$release_dir" && sha256sum --check panel.tar.gz.sha256)
                  provenance="$(tar -xOf "$release_dir/panel.tar.gz" ./.rock/release.json)"
                  printf '%s' "$provenance" | jq -e \
                      --arg theme_version "${THEME_TAG#v}" \
                      --arg pterodactyl_version "$LATEST_TAG" \
                      --arg source_commit "$(git rev-parse HEAD)" '
                          .schema == 1 and
                          .theme_version == $theme_version and
                          .pterodactyl_version == $pterodactyl_version and
                          .source_commit == $source_commit
                      ' >/dev/null

            - name: Save verified release archive
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: upstream-release-${{ needs.prepare.outputs.commit }}
                  path: |
                      ${{ runner.temp }}/verified-release/panel.tar.gz
                      ${{ runner.temp }}/verified-release/panel.tar.gz.sha256
                  if-no-files-found: error
                  retention-days: 2

    backend:
        name: PHP ${{ matrix.php }} / ${{ matrix.database.name }}
        needs: [detect, prepare]
        if: needs.detect.outputs.work_required == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        env:
            COMPOSER_NO_INTERACTION: '1'
            COMPOSER_PROCESS_TIMEOUT: '0'
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3']
                database:
                    - name: mariadb:10
                      image: mariadb:10@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
                    - name: mariadb:11
                      image: mariadb:11@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
                    - name: mysql:8
                      image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
                    - name: mysql:9
                      image: mysql:9@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
        services:
            database:
                image: ${{ matrix.database.image }}
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
                    MYSQL_DATABASE: testing
                options: >-
                    --health-cmd "if command -v mariadb-admin >/dev/null 2>&1; then mariadb-admin ping --host=127.0.0.1 --user=root --silent; else mysqladmin ping --host=127.0.0.1 --user=root --silent; fi"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
                    --health-start-period 20s
                ports:
                    - 3306/tcp
        steps:
            - name: Check out trusted workflow source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/heads/main
                  persist-credentials: false

            - name: Restore candidate bundle
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: upstream-candidate-${{ needs.prepare.outputs.commit }}
                  path: ${{ runner.temp }}

            - name: Check out verified candidate
              env:
                  EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
              run: |
                  set -euo pipefail
                  if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Invalid candidate commit: $EXPECTED_COMMIT" >&2
                      exit 1
                  fi
                  bundle="$RUNNER_TEMP/upstream-candidate.bundle"
                  git bundle verify "$bundle"
                  git fetch --force --no-tags "$bundle" \
                      '+refs/heads/automation/upstream-candidate:refs/remotes/rock-candidate/main'
                  actual_commit="$(git rev-parse 'refs/remotes/rock-candidate/main^{commit}')"
                  if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
                      echo "Candidate bundle resolved to $actual_commit, expected $EXPECTED_COMMIT." >&2
                      exit 1
                  fi
                  git checkout --detach refs/remotes/rock-candidate/main
                  test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: bcmath, cli, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
                  tools: composer:v2
                  coverage: none

            - name: Configure test environment
              run: cp .env.ci .env

            - name: Validate Composer metadata
              run: composer validate --strict --no-check-publish

            - name: Install dependencies
              run: composer install --no-progress --prefer-dist

            - name: Check PHP formatting
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Run unit tests
              run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Unit
              env:
                  DB_HOST: UNIT_NO_DB

            - name: Run integration tests
              run: vendor/bin/phpunit tests/Integration
              env:
                  DB_HOST: 127.0.0.1
                  DB_PORT: ${{ job.services.database.ports['3306'] }}
                  DB_USERNAME: root

    container:
        name: Validate container (amd64/arm64)
        needs: [detect, prepare]
        if: needs.detect.outputs.work_required == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        permissions:
            contents: read
        steps:
            - name: Check out trusted workflow source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/heads/main
                  persist-credentials: false

            - name: Restore candidate bundle
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: upstream-candidate-${{ needs.prepare.outputs.commit }}
                  path: ${{ runner.temp }}

            - name: Check out verified candidate
              env:
                  EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
              run: |
                  set -euo pipefail
                  if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Invalid candidate commit: $EXPECTED_COMMIT" >&2
                      exit 1
                  fi
                  bundle="$RUNNER_TEMP/upstream-candidate.bundle"
                  git bundle verify "$bundle"
                  git fetch --force --no-tags "$bundle" \
                      '+refs/heads/automation/upstream-candidate:refs/remotes/rock-candidate/main'
                  actual_commit="$(git rev-parse 'refs/remotes/rock-candidate/main^{commit}')"
                  if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
                      echo "Candidate bundle resolved to $actual_commit, expected $EXPECTED_COMMIT." >&2
                      exit 1
                  fi
                  git checkout --detach refs/remotes/rock-candidate/main
                  test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Build candidate image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  platforms: linux/amd64,linux/arm64

    promote:
        name: Publish verified update
        needs: [detect, prepare, frontend, backend, container]
        if: needs.detect.outputs.work_required == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        concurrency:
            group: rock-theme-release-${{ needs.detect.outputs.theme_tag }}
            cancel-in-progress: false
        permissions:
            actions: write # Required to dispatch and await the exact container runs.
            checks: read # Required by gh run watch to stream job conclusions.
            contents: write # Required to fast-forward main, create a tag, and publish the release.
            issues: write # Required to close a resolved autopilot failure report.
            packages: read # Required to verify the resulting GHCR aliases.
        env:
            CANDIDATE_SHA: ${{ needs.prepare.outputs.commit }}
            EDGE_CONTAINER_REQUIRED: ${{ needs.detect.outputs.edge_container_required }}
            EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
            EXPECTED_EDGE_COMMIT: ${{ needs.detect.outputs.edge_commit }}
            LATEST_TAG: ${{ needs.detect.outputs.latest }}
            MODE: ${{ needs.detect.outputs.mode }}
            THEME_TAG: ${{ needs.detect.outputs.theme_tag }}
            VERSION_CONTAINER_REQUIRED: ${{ needs.detect.outputs.version_container_required }}
        steps:
            - name: Check out trusted workflow source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/heads/main
                  fetch-depth: 0
                  persist-credentials: false

            - name: Restore candidate bundle
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: upstream-candidate-${{ needs.prepare.outputs.commit }}
                  path: ${{ runner.temp }}

            - name: Import verified candidate
              run: |
                  set -euo pipefail
                  if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Invalid candidate or base commit." >&2
                      exit 1
                  fi
                  bundle="$RUNNER_TEMP/upstream-candidate.bundle"
                  git bundle verify "$bundle"
                  git -c core.hooksPath=/dev/null fetch --force --no-tags "$bundle" \
                      '+refs/heads/automation/upstream-candidate:refs/remotes/rock-candidate/main'
                  actual_commit="$(git rev-parse 'refs/remotes/rock-candidate/main^{commit}')"
                  if [ "$actual_commit" != "$CANDIDATE_SHA" ]; then
                      echo "Candidate bundle resolved to $actual_commit, expected $CANDIDATE_SHA." >&2
                      exit 1
                  fi
                  git fsck --strict "$CANDIDATE_SHA"

            - name: Restore verified release archive
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: upstream-release-${{ needs.prepare.outputs.commit }}
                  path: ${{ runner.temp }}/verified-release

            - name: Validate inert release archive
              env:
                  RELEASE_DIR: ${{ runner.temp }}/verified-release
              run: |
                  set -euo pipefail
                  if [ "$(find "$RELEASE_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l)" -ne 2 ] ||
                      [ -L "$RELEASE_DIR/panel.tar.gz" ] || [ -L "$RELEASE_DIR/panel.tar.gz.sha256" ]; then
                      echo "Release artifact must contain exactly two regular files." >&2
                      exit 1
                  fi
                  checksum="$(cat "$RELEASE_DIR/panel.tar.gz.sha256")"
                  if ! [[ "$checksum" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]panel\.tar\.gz$ ]]; then
                      echo "Release checksum did not use the canonical panel.tar.gz record." >&2
                      exit 1
                  fi
                  (cd "$RELEASE_DIR" && sha256sum --check panel.tar.gz.sha256)
                  provenance="$(tar -xOf "$RELEASE_DIR/panel.tar.gz" ./.rock/release.json)"
                  printf '%s' "$provenance" | jq -e \
                      --arg theme_version "${THEME_TAG#v}" \
                      --arg pterodactyl_version "$LATEST_TAG" \
                      --arg source_commit "$CANDIDATE_SHA" '
                          .schema == 1 and
                          .theme_version == $theme_version and
                          .pterodactyl_version == $pterodactyl_version and
                          .source_commit == $source_commit
                      ' >/dev/null
                  archive_sha="${checksum%% *}"
                  archive_bytes="$(stat -c '%s' "$RELEASE_DIR/panel.tar.gz")"
                  {
                      echo "### Reproducible autopilot artifact"
                      echo "- Theme: \`${THEME_TAG}\`"
                      echo "- Pterodactyl: \`${LATEST_TAG}\`"
                      echo "- Source: \`${CANDIDATE_SHA}\`"
                      echo "- SHA-256: \`${archive_sha}\`"
                      echo "- Size: \`${archive_bytes}\` bytes"
                      echo "- Assets: two clean production builds matched"
                      echo "- Determinism: two independent archive passes matched"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Promote or confirm main
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  gh auth setup-git
                  git -c core.hooksPath=/dev/null fetch --force --no-tags origin \
                      '+refs/heads/main:refs/remotes/origin/main'
                  main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
                  if [ "$main_commit" != "$EXPECTED_BASE" ]; then
                      echo "Main changed from $EXPECTED_BASE to $main_commit during validation." >&2
                      exit 1
                  fi
                  if [ "$MODE" = update ]; then
                      read -r commit parent extra < <(git rev-list --parents -n 1 "$CANDIDATE_SHA")
                      if [ "$commit" != "$CANDIDATE_SHA" ] || [ "$parent" != "$EXPECTED_BASE" ] || [ -n "${extra:-}" ]; then
                          echo "Update candidate is not exactly one commit above the validated main commit." >&2
                          exit 1
                      fi
                      if [ -n "$(git ls-remote origin refs/heads/automation/upstream-candidate)" ]; then
                          echo "A pending autopilot candidate already exists; refusing to replace it." >&2
                          exit 1
                      fi
                      git push --atomic origin \
                          "$CANDIDATE_SHA:refs/heads/main" \
                          "$CANDIDATE_SHA:refs/heads/automation/upstream-candidate"
                  else
                      git merge-base --is-ancestor "$CANDIDATE_SHA" "$main_commit"
                  fi

            - name: Reconcile immutable tag and release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_DIR: ${{ runner.temp }}/verified-release
              run: |
                  set -euo pipefail
                  target_commit="$CANDIDATE_SHA"
                  tag_ref="refs/tags/${THEME_TAG}"
                  peeled_ref="${tag_ref}^{}"
                  remote_refs="$(git ls-remote --tags origin "$tag_ref" "$peeled_ref")"
                  if [ -n "$remote_refs" ]; then
                      remote_commit="$(printf '%s\n' "$remote_refs" | awk -v direct="$tag_ref" -v peeled="$peeled_ref" '
                          $2 == direct { direct_sha = $1 }
                          $2 == peeled { peeled_sha = $1 }
                          END { print peeled_sha != "" ? peeled_sha : direct_sha }
                      ')"
                      if [ "$remote_commit" != "$target_commit" ]; then
                          echo "Refusing to move immutable tag $THEME_TAG from $remote_commit to $target_commit." >&2
                          exit 1
                      fi
                  else
                      if git show-ref --verify --quiet "$tag_ref"; then
                          if [ "$(git rev-parse "${THEME_TAG}^{commit}")" != "$target_commit" ]; then
                              echo "Local tag $THEME_TAG does not match the verified candidate." >&2
                              exit 1
                          fi
                      else
                          git config user.name "rock-theme-autopilot[bot]"
                          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                          git tag -a "$THEME_TAG" "$target_commit" -m "Rockdactyl $THEME_TAG for Pterodactyl $LATEST_TAG"
                      fi
                      git push origin "${tag_ref}:${tag_ref}"
                  fi

                  release_assets_valid() {
                      local checksum release_dir provenance
                      release_dir="$(mktemp -d)"
                      if ! gh release download "$THEME_TAG" --dir "$release_dir" \
                          --pattern panel.tar.gz --pattern panel.tar.gz.sha256 >/dev/null 2>&1; then
                          rm -rf "$release_dir"
                          return 1
                      fi
                      if [ "$(find "$release_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -ne 2 ] ||
                          [ -L "$release_dir/panel.tar.gz" ] || [ -L "$release_dir/panel.tar.gz.sha256" ]; then
                          rm -rf "$release_dir"
                          return 1
                      fi
                      checksum="$(cat "$release_dir/panel.tar.gz.sha256")"
                      if ! [[ "$checksum" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]panel\.tar\.gz$ ]]; then
                          rm -rf "$release_dir"
                          return 1
                      fi
                      if ! (cd "$release_dir" && sha256sum --check panel.tar.gz.sha256 >/dev/null); then
                          rm -rf "$release_dir"
                          return 1
                      fi
                      provenance="$(tar -xOf "$release_dir/panel.tar.gz" ./.rock/release.json 2>/dev/null || true)"
                      if ! printf '%s' "$provenance" | jq -e \
                          --arg theme_version "${THEME_TAG#v}" \
                          --arg pterodactyl_version "$LATEST_TAG" \
                          --arg source_commit "$target_commit" '
                              .schema == 1 and
                              .theme_version == $theme_version and
                              .pterodactyl_version == $pterodactyl_version and
                              .source_commit == $source_commit
                          ' >/dev/null; then
                          rm -rf "$release_dir"
                          return 1
                      fi
                      rm -rf "$release_dir"
                  }

                  autopilot_marker="<!-- rock-theme-autopilot:source=${target_commit} -->"
                  if release_json="$(gh release view "$THEME_TAG" --json assets,author,body,isDraft 2>/dev/null)"; then
                      if [ "$(printf '%s' "$release_json" | jq -r .isDraft)" = false ] &&
                          printf '%s' "$release_json" | jq -e '
                              ([.assets[]?.name] | index("panel.tar.gz")) != null and
                              ([.assets[]?.name] | index("panel.tar.gz.sha256")) != null
                          ' >/dev/null && release_assets_valid; then
                          echo "Published release $THEME_TAG has checksum-valid assets for $target_commit."
                      else
                          release_author="$(printf '%s' "$release_json" | jq -r '.author.login // empty')"
                          release_body="$(printf '%s' "$release_json" | jq -r '.body // ""')"
                          if [ "$release_author" != 'github-actions[bot]' ] ||
                              [[ "$release_body" != *"$autopilot_marker"* ]]; then
                              echo "Refusing to modify release $THEME_TAG because Autopilot ownership was not proven." >&2
                              exit 1
                          fi
                          gh release upload "$THEME_TAG" \
                              "$RELEASE_DIR/panel.tar.gz" "$RELEASE_DIR/panel.tar.gz.sha256" --clobber
                          gh release edit "$THEME_TAG" --draft=false --latest
                      fi
                  else
                      release_notes="Automated, fully tested compatibility update for Pterodactyl ${LATEST_TAG}.

                  ${autopilot_marker}"
                      gh release create "$THEME_TAG" \
                          "$RELEASE_DIR/panel.tar.gz" "$RELEASE_DIR/panel.tar.gz.sha256" \
                          --draft \
                          --title "Rockdactyl $THEME_TAG" \
                          --notes "$release_notes" \
                          --verify-tag
                      gh release edit "$THEME_TAG" --draft=false --latest
                  fi

            - name: Dispatch and verify container publications
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  candidate_sha="$CANDIDATE_SHA"
                  if [ "$MODE" = update ]; then
                      edge_sha="$candidate_sha"
                  else
                      edge_sha="$EXPECTED_EDGE_COMMIT"
                  fi
                  if ! [[ "$edge_sha" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Invalid edge source commit: $edge_sha" >&2
                      exit 1
                  fi
                  run_ids=()
                  run_labels=()

                  dispatch_and_find() {
                      local target="$1"
                      local ref="$2"
                      local expected_sha="$3"
                      local key="autopilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${target}"
                      local title="Container / ${key}"
                      local api="repos/${GITHUB_REPOSITORY}/actions/workflows/docker.yaml/runs?event=workflow_dispatch&head_sha=${expected_sha}&per_page=100"
                      local match=""

                      gh workflow run docker.yaml --ref "$ref" \
                          -f publish_target="$target" \
                          -f expected_sha="$expected_sha" \
                          -f correlation_id="$key" >&2
                      for _ in $(seq 1 60); do
                          match="$(gh api "$api" | jq -r --arg title "$title" '
                              [.workflow_runs[] | select(.display_title == $title)] |
                              if length == 1 then (.[0].id | tostring)
                              elif length > 1 then "duplicate"
                              else ""
                              end
                          ')"
                          if [ "$match" = duplicate ]; then
                              echo "More than one container run matched $title." >&2
                              return 1
                          fi
                          if [ -n "$match" ]; then
                              printf '%s\n' "$match"
                              return 0
                          fi
                          sleep 2
                      done
                      echo "Timed out locating dispatched run $title." >&2
                      return 1
                  }

                  if [ "$VERSION_CONTAINER_REQUIRED" = true ]; then
                      run_ids+=("$(dispatch_and_find release "$THEME_TAG" "$candidate_sha")")
                      run_labels+=(release)
                  fi
                  if [ "$EDGE_CONTAINER_REQUIRED" = true ]; then
                      run_ids+=("$(dispatch_and_find edge main "$edge_sha")")
                      run_labels+=(edge)
                  fi

                  failed=false
                  for index in "${!run_ids[@]}"; do
                      if ! gh run watch "${run_ids[$index]}" --compact --exit-status --interval 10; then
                          echo "${run_labels[$index]} container publication failed." >&2
                          failed=true
                      fi
                  done
                  if [ "$failed" = true ]; then
                      exit 1
                  fi

                  owner_type="$(gh api "users/${GITHUB_REPOSITORY_OWNER}" --jq .type)"
                  if [ "$owner_type" = Organization ]; then
                      package_scope="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container"
                  else
                      package_scope="users/${GITHUB_REPOSITORY_OWNER}/packages/container"
                  fi
                  version_tag="${THEME_TAG#v}"
                  minor_tag="${version_tag%.*}"
                  release_source="source-release-${candidate_sha}"
                  edge_source="source-edge-${edge_sha}"
                  registry_ready=false
                  for _ in $(seq 1 30); do
                      package_error="$(mktemp)"
                      if ! package_pages="$(gh api --paginate "${package_scope}/${CONTAINER_PACKAGE}/versions?per_page=100" --slurp 2>"$package_error")"; then
                          if grep -q 'HTTP 404' "$package_error"; then
                              package_pages='[]'
                          else
                              cat "$package_error" >&2
                              exit 1
                          fi
                      fi
                      rm -f "$package_error"
                      if printf '%s' "$package_pages" | jq -e \
                          --arg version "$version_tag" --arg minor "$minor_tag" --arg source "$release_source" '
                              [.[][] | (.metadata.container.tags // [])] |
                              any(.[]; index($version) != null and index($minor) != null and
                                  index("latest") != null and index($source) != null)
                          ' >/dev/null && printf '%s' "$package_pages" | jq -e --arg source "$edge_source" '
                              [.[][] | (.metadata.container.tags // [])] |
                              any(.[]; index("edge") != null and index($source) != null)
                          ' >/dev/null; then
                          registry_ready=true
                          break
                      fi
                      sleep 10
                  done
                  if [ "$registry_ready" != true ]; then
                      echo "GHCR did not expose the expected release/latest/edge source markers." >&2
                      exit 1
                  fi

            - name: Finalize successful publication
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  gh auth setup-git
                  marker_ref="refs/heads/automation/upstream-candidate"
                  marker_sha="$(git ls-remote origin "$marker_ref" | awk 'NR == 1 { print $1 }')"
                  if [ -n "$marker_sha" ]; then
                      if [ "$marker_sha" != "$CANDIDATE_SHA" ]; then
                          echo "Retry marker changed from $CANDIDATE_SHA to $marker_sha; refusing to delete it." >&2
                          exit 1
                      fi
                      git push --force-with-lease="${marker_ref}:${CANDIDATE_SHA}" origin ":${marker_ref}"
                  fi
                  titles=("Autopilot blocked updating to Pterodactyl ${LATEST_TAG}" "Upstream Autopilot blocked during detection")
                  for title in "${titles[@]}"; do
                      gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[].number' | while read -r issue; do
                          [ -n "$issue" ] && gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Resolved by verified ${THEME_TAG} publication." || true
                      done
                  done
                  {
                      echo "### Publication complete"
                      echo "- Mode: \`$MODE\`"
                      echo "- Pterodactyl: \`$LATEST_TAG\`"
                      echo "- Rockdactyl: \`$THEME_TAG\`"
                      echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${THEME_TAG}"
                      echo "- Containers: verified \`version/latest/edge\` aliases"
                  } >> "$GITHUB_STEP_SUMMARY"

    resolve-healthy:
        name: Confirm healthy publication
        needs: detect
        if: needs.detect.outputs.mode == 'healthy'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write
        env:
            GH_TOKEN: ${{ github.token }}
            LATEST_TAG: ${{ needs.detect.outputs.latest }}
            THEME_TAG: ${{ needs.detect.outputs.theme_tag }}
        steps:
            - name: Resolve stale failure report
              run: |
                  set -euo pipefail
                  titles=("Autopilot blocked updating to Pterodactyl ${LATEST_TAG}" "Upstream Autopilot blocked during detection")
                  for title in "${titles[@]}"; do
                      gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[].number' | while read -r issue; do
                          [ -n "$issue" ] && gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "The ${THEME_TAG} release and container aliases are healthy." || true
                      done
                  done
                  {
                      echo "### Publication healthy"
                      echo "- Rockdactyl: \`$THEME_TAG\`"
                      echo "- No repair or republish was required."
                  } >> "$GITHUB_STEP_SUMMARY"

    report-failure:
        name: Report blocked update
        needs: [detect, prepare, frontend, backend, container, promote]
        if: >-
            ${{ always() && (needs.detect.result == 'failure' ||
                (needs.detect.result == 'success' && needs.detect.outputs.work_required == 'true' &&
                needs.promote.result != 'success')) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write # Required to create one actionable failure report.
        env:
            GH_TOKEN: ${{ github.token }}
            LATEST_TAG: ${{ needs.detect.outputs.latest }}
        steps:
            - name: Open one actionable issue
              run: |
                  set -euo pipefail
                  if [ -n "${LATEST_TAG:-}" ]; then
                      title="Autopilot blocked updating to Pterodactyl ${LATEST_TAG}"
                  else
                      title="Upstream Autopilot blocked during detection"
                  fi
                  existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
                  if [ -z "$existing" ]; then
                      gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The automatic merge, validation, release, or container reconciliation did not complete. Safe retry state is preserved and the next run will inspect it again. Review: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  fi
